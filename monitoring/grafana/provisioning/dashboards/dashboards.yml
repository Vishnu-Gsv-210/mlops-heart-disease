# Grafana dashboard provider provisioning.
# Mounted into the grafana/grafana:11.1.0 container at
# /etc/grafana/provisioning/dashboards/dashboards.yml by docker-compose.yml.
apiVersion: 1

providers:
  - name: "Heart Disease Dashboards"
    orgId: 1
    folder: ""
    # Must match the container path docker-compose.yml mounts
    # ./monitoring/grafana/dashboards to (/var/lib/grafana/dashboards).
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
