# Alerting rules for the Heart Disease API, loaded by Prometheus from
# /etc/prometheus/alert_rules.yml (see rule_files in prometheus.yml).
#
# Metric contract (from src/heart_disease/monitoring.py):
#   prediction_requests_total{status="success"|"error"}  - counter
#   prediction_request_duration_seconds{_bucket,_sum,_count} - histogram
groups:
  - name: heart_disease_api
    rules:
      - alert: APIDown
        expr: up{job="heart-disease-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: heart-disease-api
        annotations:
          summary: "Heart Disease API is unreachable"
          description: >-
            Prometheus has failed to scrape {{ $labels.job }} at
            {{ $labels.instance }} for over 1 minute. The API process may be
            down, or the /metrics endpoint is not reachable on port 8000.

      - alert: HighPredictionErrorRate
        expr: >
          rate(prediction_requests_total{status!="success"}[5m])
          / clamp_min(rate(prediction_requests_total[5m]), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
          service: heart-disease-api
        annotations:
          summary: "Prediction error rate above 5% (5m window)"
          description: >-
            More than 5% of /predict requests returned a non-success status over
            the last 5 minutes ({{ $value | humanizePercentage }}). Check API logs
            for model-load failures (503) or prediction exceptions (500).

      - alert: HighLatencyP95
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(prediction_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          service: heart-disease-api
        annotations:
          summary: "P95 prediction latency above 2 seconds"
          description: >-
            The 95th percentile of prediction request latency has exceeded
            2 seconds for 5 minutes (current: {{ $value | humanizeDuration }}).
            Investigate model load time, CPU throttling, or downstream load.

      - alert: NoTraffic
        expr: sum(rate(prediction_requests_total[10m])) == 0
        for: 10m
        labels:
          severity: info
          service: heart-disease-api
        annotations:
          summary: "No prediction traffic received for 10 minutes"
          description: >-
            The prediction_requests_total counter has not increased in the last
            10 minutes. If traffic was expected, check the load generator, the
            service exposure (port 8000), and Prometheus scrape targets.
