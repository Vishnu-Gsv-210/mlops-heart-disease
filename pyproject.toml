[project]
name = "mlops-heart-disease"
version = "1.0.0"
description = "End-to-end MLOps pipeline for heart disease classification (educational; not a medical device)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishnu Gopisetti" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.heart_disease"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["mlruns", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]
