apiVersion: v1
kind: ConfigMap
metadata:
  name: heart-disease-api-config
  namespace: heart-disease
  labels:
    app: heart-disease-api
data:
  LOG_LEVEL: "INFO"
  # Uvicorn worker/binding settings used by the container command.
  HOST: "0.0.0.0"
  PORT: "8000"
  # Suppress model-serve-side buffering so request logs stream out promptly.
  PYTHONUNBUFFERED: "1"
