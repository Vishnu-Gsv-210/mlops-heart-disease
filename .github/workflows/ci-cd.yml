name: MLOps CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests scripts

      - name: Download data and validate schema
        run: |
          python scripts/download_data.py
          python -c "from src.heart_disease.data import load_raw, validate_schema; print('Schema OK:', validate_schema(load_raw()))"

      - name: Unit tests
        run: pytest -v

      - name: Smoke train
        run: python -m src.heart_disease.train

      - name: Build Docker image
        run: docker build -t heart-disease-api:${{ github.sha }} .

      - name: Upload reports, model, and MLflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-run-artifacts
          path: |
            reports/
            models/
            mlruns/
          if-no-files-found: warn
